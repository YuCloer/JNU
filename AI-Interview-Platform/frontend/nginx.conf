server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    location /resume/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    location /interview/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    location /jd/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }
}
